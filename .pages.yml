# ==============================================================
#  .PAGES.YML: settings for Pages CMS (app.pagescms.org),
#  the editor where you log in and write posts without touching files.
#  It tells the editor which files to show and which boxes to give you.
# ==============================================================

content:

  # ---------- POSTS ----------
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: toml-frontmatter
    # New post file names come from the title, e.g. "My New Poem" -> my-new-poem.md
    filename: "{primary}.md"
    exclude: [_index.md]
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        description: Date and time. Newer posts appear at the top of the lists.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
      - name: draft
        label: Draft
        description: Tick to keep this post hidden from the site until it's ready.
        type: boolean
        default: false
      - name: taxonomies
        label: Tags
        type: object
        fields:
          - name: tags
            label: Tags
            description: Optional, e.g. update, short story.
            type: string
            list: true
      - name: description
        label: Preview
        description: Optional. A sentence or two shown in the post lists. Leave empty to use the start of the post.
        type: text
      - name: body
        label: Text
        type: rich-text

  # ---------- PORTFOLIO ----------
  - name: portfolio
    label: Portfolio
    type: collection
    path: content/portfolio
    format: toml-frontmatter
    filename: "{primary}.md"
    exclude: [_index.md]
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        description: Newer pieces appear at the top of the list.
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
      - name: extra
        label: Type
        type: object
        fields:
          - name: category
            label: Type
            description: Shown before the date in the list, e.g. POETRY — 24 Nov 2026 — Title.
            type: select
            options:
              values: [Poetry, Short Story, Fiction, Essay, Excerpt, Other]
      - name: draft
        label: Draft
        description: Tick to keep this piece hidden from the site until it's ready.
        type: boolean
        default: false
      - name: description
        label: Preview
        description: Optional. A sentence shown under the title in the list.
        type: text
      - name: body
        label: Text
        type: rich-text

  # ---------- HOME PAGE ----------
  - name: home
    label: Home page
    type: file
    path: content/_index.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Heading
        type: string
      - name: template
        type: string
        hidden: true
        default: home.html
      - name: body
        label: Welcome text
        description: The "Latest posts" list is added underneath automatically.
        type: rich-text

  # ---------- ABOUT / PORTFOLIO / CONTACT ----------
  - name: about
    label: About page
    type: file
    path: content/pages/about.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Heading
        type: string
      - name: path
        type: string
        hidden: true
      - name: body
        label: Text
        type: rich-text

  - name: portfolio-intro
    label: Portfolio intro
    type: file
    path: content/portfolio/_index.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Heading
        type: string
      - name: sort_by
        type: string
        hidden: true
        default: date
      - name: template
        type: string
        hidden: true
        default: portfolio.html
      - name: page_template
        type: string
        hidden: true
        default: post.html
      - name: body
        label: Intro text
        description: Shown above the list of pieces, which is added automatically.
        type: rich-text

  - name: contact
    label: Contact page
    type: file
    path: content/pages/contact.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Heading
        type: string
      - name: path
        type: string
        hidden: true
      - name: body
        label: Text
        type: rich-text
