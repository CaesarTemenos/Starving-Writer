# ==============================================================
#  CONFIG.TOML: your site's settings.
#  Lines starting with # are comments (notes for you).
#  Settings look like:   name = "value"
# ==============================================================

# The address the site will live at once it's online.
base_url = "https://solemnvespers.com"

# Your site's name (shown on browser tabs).
title = "Solemn Vespers"

# The theme in the themes/ folder.
theme = "terminimal"

# Required by the theme.
compile_sass = true

# Creates an RSS feed, so readers can follow you in a feed reader.
generate_feeds = true
feed_filenames = ["atom.xml"]

# Lets you add tags to posts, e.g.  tags = ["poetry"]
taxonomies = [
    {name = "tags"}
]

[markdown]
# Turns "quotes" into “curly quotes” and -- into an en dash.
smart_punctuation = true

[extra]

# ---- COLOURS ----
# accent_color:     blue, green, orange, pink or red
# background_color: blue, dark, green, orange, pink, red, light or auto
accent_color = "green"
background_color = "dark"

# ---- NAME & FOOTER ----
# The text in the green block at the top left.
logo_text = "Solemn Vespers"
# The line under the site name, on every page. Leave the quotes empty ("") to hide it.
tagline = "The writing and portfolio of Seamus Caesar."

# Shown in the footer as "© <year> Solemn Vespers".
author = "Solemn Vespers"

# ---- MENU ----
# $BASE_URL means "this website's address". Add, remove or reorder freely.
menu_items = [
    {name = "home",      url = "$BASE_URL"},
    {name = "posts",     url = "$BASE_URL/posts"},
    {name = "about",     url = "$BASE_URL/about"},
    {name = "portfolio", url = "$BASE_URL/portfolio"},
    {name = "contact",   url = "$BASE_URL/contact"},
]

# ---- POSTS ----
# How many posts the home page lists under "Latest posts".
home_latest_posts = 5

# How many characters of a post to show in its preview (when its Preview box is empty).
preview_length = 250

# Show "previous post / next post" buttons at the bottom of each post.
enable_post_view_navigation = true
post_view_navigation_prompt = "Thanks for reading! Read more?"

# Browser tab text: "Post title | Solemn Vespers".
page_titles = "combined"

# Use the full Hack font so every character (é, —, “ ”, etc.) displays properly.
use_full_hack_font = true
