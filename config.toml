# ==============================================================
#  CONFIG.TOML: your site's settings.
#  Lines starting with # are comments (notes for you).
#  Settings look like:   name = "value"
# ==============================================================

# The address the site lives at.
base_url = "https://solemnvespers.com"

# Your site's name (top left of every page, and on browser tabs).
title = "Solemn Vespers"

# A one-line description, used by search engines and link previews.
description = "The writing and portfolio of Seamus Caesar."

# The theme in the themes/ folder.
theme = "austere"

# The theme keeps its styles inside its templates, so no Sass is needed.
compile_sass = false

default_language = "en"

# Creates feeds, so readers can follow you in a feed reader.
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

# Lets you add tags to posts.
taxonomies = [{ name = "tags", feed = true }]

[markdown]
# Turns "quotes" into “curly quotes” and -- into an en dash.
smart_punctuation = true

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]

# ---- HEADER ----
# The line shown next to the site name (hidden on narrow phone screens).
strapline = "The writing and portfolio of Seamus Caesar."
# The small icon left of the site name. "quill.svg" is the theme's quill.
# Put a # in front of this line to hide the icon.
site_icon = "quill.svg"

# ---- HOME PAGE ----
# The round picture at the top of the home page (file is in static/images/).
profile_picture = "/images/profile.png"
# How many posts the home page previews under "Latest posts".
home_latest_posts = 5
# How many characters of a post to show in its preview (when its Preview box is empty).
preview_length = 250

# ---- FOOTER ----
footer_text = "© 2026 Solemn Vespers · Theme: <a href='https://github.com/tomwrw/austere-theme-zola'>austere</a>"

# ---- BROWSER ICON ----
favicon = "/favicon.ico"

# ---- MENU ----
# $BASE_URL means "this website's address". Add, remove or reorder freely.
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
  { url = "$BASE_URL/posts/", name = "Posts" },
  { url = "$BASE_URL/about/", name = "About" },
  { url = "$BASE_URL/portfolio/", name = "Portfolio" },
  { url = "$BASE_URL/contact/", name = "Contact" },
]

# ---- ICONS ----
inline_icons = true
icon_path = "themes/austere/static/icons/"
icons = ["light", "asleep", "rss"]

# ---- IMAGES IN POSTS ----
image_format = "auto"
image_quality = 80
images_default_size = 1024
images_sizes = [512, 1024, 2048]

# ---- COLOURS ----
# The site is always shown in the dark colours below (see templates/base.html).
# Colours are written as #RRGGBB.
[extra.colours.dark]
background = "#141413"    # page background
text = "#e8e8e8"          # main text
text_muted = "#a0a0a0"    # paragraphs, dates
accent = "#E07A5F"        # links, site name, highlights
accent_hover = "#F4A594"  # links when the mouse is over them
code_bg = "#1e1e1d"
border = "#2a2a29"        # dividing lines

# (Light colours, only used if you ever turn the light/dark switch back on.)
[extra.colours.light]
background = "#FAF7F2"
text = "#1a1a1a"
text_muted = "#3a3a3a"
accent = "#9E4440"
accent_hover = "#7A3533"
code_bg = "#f0ebe3"
border = "#e0d9ce"
