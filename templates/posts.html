{#
  POSTS PAGE LAYOUT: the title, then a preview of every post, newest first.
#}
{% extends "base.html" %}

{% block content %}
<h1>{{ section.title }}</h1>
{{ section.content | safe }}
{% for post in section.pages %}
{{ <post_preview page={post}/> }}
{% else %}
<p class="empty">Nothing posted yet.</p>
{% endfor %}
{% endblock content %}
